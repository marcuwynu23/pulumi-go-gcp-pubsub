name: CD - Pulumi GCP Pub/Sub (Destroy)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: GCP region
        required: true
        type: string
        default: us-central1
      topic_name:
        description: Pub/Sub topic name
        required: true
        type: string
        default: my-topic
      message_retention_duration:
        description: Message retention duration
        required: true
        type: string
        default: 86600s
      labels:
        description: Topic labels (JSON)
        required: true
        type: string
        default: '{"environment": "dev"}'
      subscription_name:
        description: Pub/Sub subscription name
        required: true
        type: string
        default: my-subscription
      ack_deadline_seconds:
        description: Acknowledgement deadline in seconds
        required: true
        type: string
        default: "20"
      push_endpoint:
        description: Push endpoint URL
        required: false
        type: string
        default: ""
      push_attributes:
        description: Push attributes (JSON)
        required: true
        type: string
        default: '{}'
      expiration_ttl:
        description: Subscription expiration TTL
        required: true
        type: string
        default: 86400s
      min_retry_backoff:
        description: Minimum retry backoff
        required: true
        type: string
        default: 10s
      max_retry_backoff:
        description: Maximum retry backoff
        required: true
        type: string
        default: 600s
      enable_message_ordering:
        description: Enable message ordering
        required: true
        type: string
        default: "false"
      backend_type:
        description: State backend (local, gcs, pulumi)
        required: true
        type: string
        default: local
      gcs_state_bucket:
        description: GCS bucket for state (if backend_type=gcs)
        required: false
        type: string
        default: ""

env:
  PULUMI_STACK: pubsub-${{ github.event.inputs.region }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  GCP_PROJECT: ${{ github.event.inputs.project_id }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

jobs:
  destroy:
    name: Pulumi Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          command: version

      - name: Configure Pulumi Backend
        run: |
          if [ "${{ github.event.inputs.backend_type }}" = "local" ]; then
            pulumi login --local
            echo "Using local filesystem backend"
          elif [ "${{ github.event.inputs.backend_type }}" = "gcs" ]; then
            if [ -z "${{ github.event.inputs.gcs_state_bucket }}" ]; then
              echo "ERROR: gcs_state_bucket required for gcs backend"
              exit 1
            fi
            pulumi login gs://${{ github.event.inputs.gcs_state_bucket }}
            echo "Using GCS backend: gs://${{ github.event.inputs.gcs_state_bucket }}"
          else
            if [ -z "${{ secrets.PULUMI_ACCESS_TOKEN }}" ]; then
              echo "ERROR: PULUMI_ACCESS_TOKEN required for Pulumi Cloud backend"
              exit 1
            fi
            pulumi login --cloud-url https://api.pulumi.com
            echo "Using Pulumi Cloud backend"
          fi

      - name: Configure Pulumi Stack
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }} 2>/dev/null || echo "Stack not found"

      - name: Set Pulumi Config
        run: |
          pulumi config set gcp:project ${{ github.event.inputs.project_id }}
          pulumi config set gcp:region ${{ github.event.inputs.region }}
          pulumi config set pubsub:topicName ${{ github.event.inputs.topic_name }}
          pulumi config set pubsub:messageRetentionDuration ${{ github.event.inputs.message_retention_duration }}
          pulumi config set pubsub:labels '${{ github.event.inputs.labels }}'
          pulumi config set pubsub:subscriptionName ${{ github.event.inputs.subscription_name }}
          pulumi config set pubsub:ackDeadlineSeconds ${{ github.event.inputs.ack_deadline_seconds }}
          pulumi config set pubsub:pushEndpoint ${{ github.event.inputs.push_endpoint }}
          pulumi config set pubsub:pushAttributes '${{ github.event.inputs.push_attributes }}'
          pulumi config set pubsub:expirationTtl ${{ github.event.inputs.expiration_ttl }}
          pulumi config set pubsub:minRetryBackoff ${{ github.event.inputs.min_retry_backoff }}
          pulumi config set pubsub:maxRetryBackoff ${{ github.event.inputs.max_retry_backoff }}
          pulumi config set pubsub:enableMessageOrdering ${{ github.event.inputs.enable_message_ordering }}

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Build
        run: go build -v .

      - name: Pulumi Preview (Destroy)
        run: |
          pulumi preview --stack ${{ env.PULUMI_STACK }} --destroy --yes

      - name: Pulumi Destroy
        run: |
          pulumi destroy --stack ${{ env.PULUMI_STACK }} --yes